# Column schemas for SIH (Sistema de Informações Hospitalares)
# Source: DATASUS SIH documentation

rd_reduzida:
  - name: n_aih
    type: string
    description_pt: "Número da AIH"
    description_en: "AIH number"
    format: "12 digits"
    required: true
  - name: ident
    type: string
    description_pt: "Tipo de AIH (1=Normal, 2=Óbito, 3=Intercorrência)"
    description_en: "AIH type (1=Normal, 2=Death, 3=Intercurrence)"
  - name: uf_zi
    type: string
    description_pt: "Código da UF do estabelecimento"
    description_en: "Establishment state code"
  - name: ano_cmpt
    type: string
    description_pt: "Ano de competência"
    description_en: "Competence year"
    format: "YYYY"
  - name: mes_cmpt
    type: string
    description_pt: "Mês de competência"
    description_en: "Competence month"
    format: "MM"
  - name: nasc
    type: string
    description_pt: "Data de nascimento"
    description_en: "Date of birth"
    format: "YYYYMMDD"
  - name: sexo
    type: string
    description_pt: "Sexo (1=Masc, 2=Fem, 9=Ignorado)"
    description_en: "Sex (1=Male, 2=Female, 9=Unknown)"
  - name: cgc_hosp
    type: string
    description_pt: "CNPJ do hospital"
    description_en: "Hospital CNPJ"
  - name: cpf_aut
    type: string
    description_pt: "CPF do paciente autorizado"
    description_en: "Authorized patient CPF"
  - name: nacio
    type: string
    description_pt: "Nacionalidade"
    description_en: "Nationality"
  - name: cep
    type: string
    description_pt: "CEP de residência"
    description_en: "Residence ZIP code"
    format: "8 digits"
  - name: munic_res
    type: string
    description_pt: "Código IBGE do município de residência"
    description_en: "IBGE municipality code of residence"
  - name: nmep
    type: string
    description_pt: "Número do prontuário"
    description_en: "Medical record number"
  - name: dt_inter
    type: string
    description_pt: "Data de internação"
    description_en: "Admission date"
    format: "YYYYMMDD"
  - name: dt_saida
    type: string
    description_pt: "Data de saída"
    description_en: "Discharge date"
    format: "YYYYMMDD"
  - name: diar_acom
    type: integer
    description_pt: "Diarias de acompanhante"
    description_en: "Companion days"
  - name: qt_diarias
    type: integer
    description_pt: "Quantidade de diárias"
    description_en: "Number of days"
  - name: procedural
    type: string
    description_pt: "Código do procedimento (TUSS)"
    description_en: "Procedure code (TUSS)"
  - name: val_sh
    type: float
    description_pt: "Valor da SP/SADT"
    description_en: "SP/SADT value"
    unit: "BRL"
  - name: val_sp
    type: float
    description_pt: "Valor da SP"
    description_en: "SP value"
    unit: "BRL"
  - name: val_sadt
    type: float
    description_pt: "Valor da SADT"
    description_en: "SADT value"
    unit: "BRL"
