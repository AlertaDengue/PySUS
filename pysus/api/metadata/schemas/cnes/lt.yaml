# CNES hospital beds (LT) columns, a deliberately small curated subset.
# Source: Ministério da Saúde / DATASUS, Informe Técnico CNES 2017-06,
# section 2.4, "Layout dos arquivos de Leitos - Nomenclatura (LT*.dbf)".
# ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Doc/IT_CNES_1706.pdf
# The layout describes the 2017 dissemination format; it does not claim
# completeness or validate every later CNES release.
# Value codes and the QT_NSUS label come from the official DATASUS TabWin
# package TAB_CNES.zip (October 2026): Leitos_Especialidade.def,
# CNV/tip1leit.cnv and CNV/Esp_leit.CNV.
# ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Auxiliar/TAB_CNES.zip
# Checked against the official LTCE2610 file (October 2026):
# - QT_NSUS and NAT_JUR are in that file but not in section 2.4. QT_NSUS is
#   labelled in Leitos_Especialidade.def, whose notes define non-SUS beds as
#   existing beds minus SUS beds (QT_EXIST - QT_SUS), which held for every
#   row; NAT_JUR is described in the other sections of the same layout.
# - TP_LEITO is CHAR(2) in the layout and file header, but its values use a
#   single character, so this curated schema does not fix its width.
# - CODLEITO 96 appears in that file but not in Esp_leit.CNV. CODLEITO labels
#   are copied as published; some repeat across bed types (e.g. 02 and 32).

lt:
  - name: CNES
    type: string
    description_pt: "Número nacional do estabelecimento de saúde"
    description_en: "National health establishment number"
    format: "7 characters"
  - name: CODUFMUN
    type: string
    description_pt: "Código do município do estabelecimento: UF + município (sem dígito)"
    description_en: "Establishment municipality code: state + municipality (without check digit)"
  - name: TP_LEITO
    type: string
    description_pt: "Tipo do leito"
    description_en: "Bed type"
    categories: "1-Cirúrgico 2-Clínico 3-Complementar 4-Obstétrico 5-Pediátrico 6-Outras Especialidades 7-Hospital/DIA"
  - name: CODLEITO
    type: string
    description_pt: "Especialidade do leito"
    description_en: "Bed specialty"
    format: "2 characters"
    categories: >-
      01-BUCO MAXILO FACIAL 02-CARDIOLOGIA 03-CIRURGIA GERAL
      04-ENDOCRINOLOGIA 05-GASTROENTEROLOGIA 06-GINECOLOGIA
      07-CIRURGICO/DIAGNOSTICO/TERAPEUTICO 08-NEFROLOGIAUROLOGIA
      09-NEUROCIRURGIA 10-OBSTETRICIA CIRURGICA 11-OFTALMOLOGIA
      12-ONCOLOGIA 13-ORTOPEDIATRAUMATOLOGIA 14-OTORRINOLARINGOLOGIA
      15-PLASTICA 16-TORAXICA 31-AIDS 32-CARDIOLOGIA 33-CLINICA GERAL
      34-CRONICOS 35-DERMATOLOGIA 36-GERIATRIA 37-HANSENOLOGIA
      38-HEMATOLOGIA 39-LEITO/DIA 40-NEFROUROLOGIA 41-NEONATOLOGIA
      42-NEUROLOGIA 43-OBSTETRICIA CLINICA 44-ONCOLOGIA
      45-PEDIATRIA CLINICA 46-PNEUMOLOGIA 47-PSIQUIATRIA 48-REABILITACAO
      49-PNEUMOLOGIA SANITARIA 61-UTI ADULTO 62-UTI INFANTIL
      63-UTI NEONATAL 64-UNIDADE INTERMEDIARIA
      65-UNIDADE INTERMEDIARIA NEONATAL 66-UNIDADE ISOLAMENTO
      67-TRANSPLANTE 68-PEDIATRIA CIRURGICA 69-AIDS 70-FIBROSE CISTICA
      71-INTERCORRENCIA POS-TRANSPLANTE 72-GERIATRIA 73-SAUDE MENTAL
      74-UTI ADULTO - TIPO I 75-UTI ADULTO - TIPO II
      76-UTI ADULTO - TIPO III 77-UTI PEDIATRICA - TIPO I
      78-UTI PEDIATRICA - TIPO II 79-UTI PEDIATRICA - TIPO III
      80-UTI NEONATAL - TIPO I 81-UTI NEONATAL - TIPO II
      82-UTI NEONATAL - TIPO III 83-UTI DE QUEIMADOS
      84-ACOLHIMENTO NOTURNO 85-UTI CORONARIANA TIPO II - UCO TIPO II
      86-UTI CORONARIANA TIPO III - UCO TIPO III 87-SAUDE MENTAL
      88-QUEIMADO ADULTO 89-QUEIMADO PEDIATRICO 90-QUEIMADO ADULTO
      91-QUEIMADO PEDIATRICO
      92-UNIDADE DE CUIDADOS INTERMED NEONATAL CONVENCIONAL
      93-UNIDADE DE CUIDADOS INTERMED NEONATAL CANGURU
      94-UNIDADE DE CUIDADOS INTERMEDIARIOS PEDIATRICO
      95-UNIDADE DE CUIDADOS INTERMED ADULTO
  - name: QT_EXIST
    type: string
    description_pt: "Quantidade de leitos existentes"
    description_en: "Number of existing beds"
  - name: QT_CONTR
    type: string
    description_pt: "Quantidade de leitos contratados"
    description_en: "Number of contracted beds"
  - name: QT_SUS
    type: string
    description_pt: "Quantidade de leitos para o SUS"
    description_en: "Number of beds for the public health system (SUS)"
  - name: QT_NSUS
    type: string
    description_pt: "Quantidade de leitos não SUS"
    description_en: "Number of beds outside the public health system (non-SUS)"
  - name: COMPETEN
    type: string
    description_pt: "Ano e mês de competência da informação"
    description_en: "Year and month of the information's reference period"
    format: "YYYYMM"
  - name: NAT_JUR
    type: string
    description_pt: "Natureza jurídica"
    description_en: "Legal nature"
