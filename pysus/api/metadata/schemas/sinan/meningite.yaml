# Column schemas for SINAN - MENI
# Source: MENI.csv from SINAN metadata tarball
# Total CSV rows: 101, exported fields: 100, skipped: 2

meningite:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "data de ínicio da investigação do caso."
    required: true
    categories: dd/mm/aaaa
    characteristics: Campo obrigatório campo= > data da notificação
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e comércio)."
    type_info: "varchar(6)"
  - name: ANT_AC
    field: "st_vacina_polissacaridica_ac"
    type: string
    description_pt: "Informar se o paciente tem história vacinal de polissacarídica A/C"
    type_info: "varchar2(1)"
    categories: 1 – Sim 2 – Não 9 – Ignorado
    characteristics: Se categoria = 2 ou 9 pular para Vacinação Polissacarídica B/C
  - name: ANT_DOSE_3
    field: "nu_dose_polissacaridica_ac"
    type: string
    description_pt: "Nº de doses da vacina polissacarídica A/C"
    type_info: "number(2)"
  - name: ANT_DTUL_3
    field: "dt_dose_polissacaridica_ac"
    type: date
    description_pt: "data da última dose da vacinação polissacarídica A/C"
    characteristics: Data não deve ser maior que a data atual
  - name: ANT_BC
    field: "st_vacina_polissacaridica_bc"
    type: string
    description_pt: "Informa se o paciente tem história vacinal de polissacarídica B/C"
    type_info: "varchar2(1)"
    categories: 1 – Sim 2 – Não 9 – Ignorado
    characteristics: Se categoria = 2 ou 9 pular para Vacinação Conjugada meningo C
  - name: ANT_DOSES_
    field: "nu_dose_polissacaridica_bc"
