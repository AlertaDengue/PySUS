    type_info: "varchar2(1)"
    required: true
    categories: 1-confirmado 2-descartado
    characteristics: Campo Obrigatório quando o campo data de encerramento estiver preenchido.
  - name: CON_DIAGES
    field: "tp_classificacao_confirmado"
    type: string
    type_info: "varchar2(2)"
    required: true
    categories: 1-Meningococcemia 2-Meningite Meningocócic a 3-Meningite Meningocócica com Meningococcemia 4-Meningite Tuberculosa 5-Meningite por outras bactérias 6-Meningite não especificada 7-Meningite Asséptica 8-Meningite por outra etiologia 9-Meningite por Hemófilo 10- Meningite por Pneumococo
    characteristics: 'Campo Obrigatório se campo classificação do caso=1(confirmado) O campo deve ter obrigatoriamente 2 dígitos. Caso seja digitado um numero de 1 a 9, autocompletar com o zero a esquerda (Ex: 01, 09) Quando categoria diferente de 1, 2 e 3 desabilitar o campo 53 (Se N. meningiditis). Os campos 54 (Número de Comunicantes), 55 (Realizada Quimioprolaxia) e 56 (Se sim, Data) só devem ser habilitados se campo 51 (Se confirmado, especifique) for preenchido com 1, 2, 3, 5 ou 9. Campo não habilitado se classificação final diferente de 1- Confirmado'
  - name: CLA_ME_BAC
    field: "co_bacteria"
    type: string
    description_pt: "diagnóstico final conforme o Quadro II"
    type_info: "varchar(4)"
    required: true
    categories: Conforme quadro II
    characteristics: Campo obrigatório se campo 51 (Se Confirmado, Especifique) igual a 5.
  - name: CLA_ME_ASS
    field: "co_asseptica"
    type: string
    description_pt: "diagnóstico final conforme o Quadro III"
    type_info: "varchar(4)"
    required: true
    categories: Conforme quadro III
    characteristics: Campo obrigatório se campo 51 (Se Confirmado, Especifique) igual a 7.
  - name: CLA_ME_ETI
    field: "co_etiologia"
    type: string
    description_pt: "diagnóstico final conforme o Quadro IV"
    type_info: "varchar(4)"
    required: true
    categories: Conforme quadro IV
    characteristics: Campo obrigatório se campo 51 (Se Confirmado, Especifique) igual a 8.
  - name: CRITERIO
