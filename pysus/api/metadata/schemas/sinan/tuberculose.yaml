# Column schemas for SINAN - TUBE
# Source: TUBE.csv from SINAN metadata tarball
# Total CSV rows: 55, exported fields: 56, skipped: 0

tuberculose:
  - name: NU_PRONTUA
    field: "nu_prontuario"
    type: string
    description_pt: "Nº do prontuário do paciente na unidade de saúde"
    type_info: "Varchar2(10)"
    categories: Nº/caracter atribuídos pela Unidade de Saúde
    characteristics: Campo de preenchimento livre segundo as normas definidas pela unidade de saúde
  - name: TRATAMENTO
    field: "tp_entrada"
    type: string
    description_pt: "Preencher com o código correspondente ao tipo de entrada do paciente na unidade de saúde. O “caso novo” é todo paciente que nunca se submeteu ao tratamento de tuberculose, ou o fez por até 30 dias. Os retratamentos podem acontecer por: “recidiva” após cura e “reingresso após abandono”, quando ocorre interrupção de um tratamento por mais de 30 dias. O “Não sabe” deve ser preenchido apenas quando esgotadas as possibilidades de investigação das entradas anteriores do paciente. A “transferência” se refere ao paciente encaminhado de outro serviço para seguimento do tratamento. Os casos com entrada “Pós- óbito” são aqueles identificados tardiamente, ou seja, no momento ou após a morte do paciente."
    type_info: "Varchar2(1)"
    categories: 1. Caso Novo 2. Recidiva 3. Reingresso após Abandono 4. Não Sabe 5. Transferência 6. Pós-óbito
    characteristics: Campo Obrigatório Se Campo 32 (Tipo de Entrada) = 6 (pós-óbito), o Campo 62 (Situação de Encerramento) só poderá ser preenchido com 3 (óbito por TB) ou 4 (óbito por outras causas)
  - name: POP_LIBER
    field: "tp_pop_liberdade"
    type: string
    description_pt: "Informar situação do paciente quanto à condição de vulnerabilidade. Sendo considerada População Privada de Liberdade a população prisional segundo a secretaria de administração penitenciária e/ou de justiça e a população cumprindo medida sócio educativa de restrição de liberdade."
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: POP_RUA
    field: "tp_pop_rua"
    type: string
    description_pt: "Informar situação do paciente quanto à condição de vulnerabilidade."
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: POP_SAUDE
    field: "tp_pop_saúde"
    type: string
    description_pt: "Informar situação do paciente quanto à condição de vulnerabilidade."
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: POP_IMIG
    field: "tp_pop_imigrante"
    type: string
    description_pt: "Informar situação do paciente quanto à condição de vulnerabilidade. Sendo considerado Imigrante, o estrangeiro residente no Brasil por menos de 2 anos."
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: BENEF_GOV
    field: "tp_benef_gov"
    type: string
    description_pt: "Preencher com o código correspondente, se beneficiário de programa de transferência de renda do governo"
    categories: 1- Sim 2- Não 9- Ignorado
    characteristics: Campo Essencial
  - name: FORMA
    field: "tp_forma"
    type: string
    description_pt: "Forma clínica da tuberculose, por ocasião da notificação, segundo a sua localização."
    type_info: "Varchar2(1)"
    categories: 1. Pulmonar 2. Extrapulmonar 3. Pulmonar + Extrapulmonar
    characteristics: Campo Obrigatório Se Forma= 1, o campo 36 (Se Extrapulmonar) não será habilitado e o cursor pula para item 37 (Doenças e Agravos Associados) Se Forma= 2 ou 3, o campo 36 (Se Extrapulmonar) é de preenchimento obrigatório. Quando Forma=2 os campos 58 (Baciloscopia no 1º, 2º, 3º, 4º, 5º, 6º e após 6º mês) preenchidos automaticamente com a opção 4 (Não se aplica)
  - name: EXTRAPU_N
    field: "tp_extrapulmonar"
    type: string
    description_pt: "Localização extrapulmonar da tuberculose nos casos em que o paciente apresente a forma clínica igual a 2 ou 3. O item “outra” se refere às formas extrapulmonares que não estão contidas nas categorias de 1 a 9."
    type_info: "Varchar2(2)"
    categories: 1. Pleural 2. Gang. Perif. 3. Geniturinária 4. Óssea 5. Ocular 6. Miliar 7. Meningoencefálico 8. Cutânea 9.Laringea 10. Outra
    characteristics: Campo Obrigatório Se campo 35 (Forma) = 2 (. Extrapulmonar) ou 3 (Pulmonar + Extrapulmonar) Se campo 36 (Se extrapulmonar) =10 (outra), habilitar campo Outras especificar para preenchimento Desabilitar campo se campo 35(Forma)=1
  - name: EXTRAPUL_O
    field: "ds_extrapulmonar_outro"
    type: string
    description_pt: "Se extrapulmonar outro tipo que não os listados especificar"
    type_info: "Varchar2(30)"
    characteristics: Se campo 36 (Se extrapulmonar) =10 (outras), habilitar este campo para preenchimento
  - name: AGRAVAIDS
    field: "st_agravo_aids"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial Se Aids=1(Sim) o campo 40 (HIV) é preenchido automaticamente com 1 (Positivo) e ficará desabilitado para Alterações
  - name: AGRAVALCOO
    field: "st_agravo_alcolismo"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: AGRAVDIABE
    field: "st_agravo_diabete"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: AGRAVDOENC
    field: "st_agravo_mental"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: AGRAVDROGAS
    field: "st_agravo_drogas"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: AGRAVTABACO
    field: "st_agravo_tabaco"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: AGRAVOUTRA
    field: "st_agravo_outro"
    type: string
    description_pt: "Informar se existem agravos associados à tuberculose por ocasião da notificação"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial Se campo 37 (Doenças e Agravos Associados – Outras)=1 (Sim), habilitar campo especificar para preenchimento
  - name: AGRAVOUTDE
    field: "ds_agravo_outro"
    type: string
    description_pt: "Especificar qual outros agravos associados"
    type_info: "Varchar2(30)"
    characteristics: Campo Essencial Se campo 37 (Doenças e Agravos Associados – Outro)=1 (Sim), habilitar campo para Preenchimento
  - name: BACILOSC_E
    field: "st_baciloscopia_escarro"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo álcool ácido resistente) realizada em 1ª e 2ª amostras para diagnóstico O resultado positivo em qualquer das baciloscopia de diagnóstico deve ser informado. Usa-se o a opção 4=Não se aplica para os casos cujo campo 35 (Forma) = 2 (Extrapulmonar)."
    type_info: "Varchar2(1)"
    categories: 1. Positiva 2. Negativa 3. Não realizada 4. Não se aplica
    characteristics: Campo Obrigatório Se Baciloscopia de escarro= 1(positiva) o campo 35 (Forma) não poderá ser= 2. Caso seja, emitir alerta para alteração (“Baciloscopia positiva requer Forma Pulmonar”). Não permitir avanço caso continue inconsistente.
  - name: RAIOX_TORA
    field: "tp_raio_x"
    type: string
    description_pt: "Resultado da radiografia do tórax por ocasião da notificação (a opção 3 diz respeito a outras alterações não compatíveis com a tuberculose)"
    type_info: "Varchar2(1)"
    categories: 1. Suspeito 2. Normal 3. Outra patologia 4. Não realizado
    characteristics: Campo Essencial
  - name: HIV
    field: "tp_hiv"
    type: string
    description_pt: "Resultado da sorologia para o vírus da imunodeficiência adquirida, realizado anterior ou posteriormente a notificação de TB. Objetiva avaliar a coinfecção pelo HIV e não a oferta do teste aos pacientes de TB."
    type_info: "varchar(1)"
    categories: 1. Positivo 2. Negativo 3. Em andamento 4. Não realizado
    characteristics: Campo Obrigatório Se campo 37 (Doenças e Agravos associados AIDS)= 1 (Sim) o campo 40 (HIV) é preenchido automaticamente com 1 (Positivo)e ficará desabilitado para alterações Se o campo 40. HIV estiver preenchido com a opção= 3 (Em andamento), alterar automaticamente para 4 (Não realizado) quando o campo 62 (situação de encerramento) for preenchido com as opções 1,2,3,4,6 ou 10 Se HIV= 2, 3 ou 4 o campo 41 (Terapia Antirretroviral durante o tratamento para TB) NÃO será habilitado para preenchimento.
  - name: ANTIRRETROVIRAL
    field: "tp_antirretroviral_tratament"
    type: string
    description_pt: "Monitorar o uso da Terapia Antirretroviral para HIV/AIDS durante o tratamento de tuberculose"
    type_info: "Varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial Se campo 40 (HIV)= 2, 3 ou 4 esse campo não será habilitado.
  - name: HISTOPATOL
    field: "tp_histopatologia"
    type: string
    description_pt: "Resultado do exame histopatólogico para diagnóstico de TB"
    type_info: "Varchar2(1)"
    categories: 1. Baar Positivo 2. Sugestivo de TB 3. Não sugestivo de TB 4. Em andamento 5. Não realizado
    characteristics: Campo Essencial
  - name: CULTURA_ES
    field: "tp_cultura_escarro"
    type: string
    description_pt: "Resultado da cultura de escarro ou outro material realizada para tuberculose"
    type_info: "varchar(1)"
    categories: 1. Positiva 2. Negativa 3. Em andamento 4. Não realizada
    characteristics: Campo Obrigatório Caso CULTURA=1 (Positiva) habilitar para preenchimento o campo 45 (Teste de Sensibilidade) Se a CULTURA estiver preenchida com a opção= 3 (Em andamento), alterar automaticamente para 4 (Não realizado) quando o campo 62 (situação de encerramento) for preenchido com as opções 1,2,3,4,6 ou 10
  - name: TESTE_MOLEC
    field: "tp_molecular"
    type: string
    description_pt: "Resultado do exame do Teste Molecular Rápido para TB realizado para M. tuberculosis e resistência a rifampicina (amostra para diagnóstico)"
    type_info: "Varchar2(1)"
    categories: 1.Detectável sensível à Rifampicina 2. Detectável resistente à Rifampicina 3. Não detectável 4. Inconclusivo 5. Não realizado
    characteristics: Campo Essencial
  - name: TEST_SENSIBILID
    field: "tp_sensibilidade"
    type: string
    description_pt: "Resultado do teste de sensibilidade do paciente para conhecimento oportuno do padrão de resistência às drogas do esquema básico."
    categories: 1. Resistente somente à Isoniazida 2. Resistente somente à Rifampicina 3. Resistente à Isoniazida e Rifampicina 4. Resistente a outras drogas de 1ª linha 5. Sensível 6. Em andamento 7. Não realizado
    characteristics: Campo Obrigatório para preenchimento caso campo 43 (Cultura)= 1(Positiva). Se Teste de Sensibilidade for preenchido com as opções 1,2 ou 3 o campo 62 (Situação de Encerramento) deverá ser preenchido automaticamente com a opção 7 (TB DR)
  - name: DT_INIC_TR
    field: "dt_inicio_tratamento"
    type: date
    description_pt: "Data em que o paciente iniciou o tratamento atual. Em situações de transferência essa data deverá ser igual a data de início do tratamento onde o paciente diagnosticou e iniciou o tratamento."
    categories: dd/mm/aaaa
    characteristics: Campo Essencial Data de início do tratamento atual  data do diagnostico. Data de início do tratamento atual ≤ que a data atual do sistema.
  - name: NU_COMU_ID
    field: "nu_contato_identificados"
    type: string
    description_pt: "Preencher o total de Contatos identificados pelo paciente na ocasião do diagnóstico do caso."
    type_info: "Number(2)"
    characteristics: Campo Obrigatório
  - name: SG_UF_ATUAL
    field: "co_uf_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 4 (UF de Notificação) da notificação Preenchimento automático no momento da digitação da ficha de notificação/ Investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para Outra.
  - name: ID_MUNIC_AT
    field: "co_municipio_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 5 (Município de Notificação) da notificação Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra.
  - name: NU_NOTI_AT
    field: "nu_notificacao_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo “Número Da Notificação” Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para Outra.
  - name: DT_NOTI_AT
    field: "dt_notificacao_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 3 (Data da Notificação) da notificação Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para Outra.
  - name: ID_UNID_AT
    field: "co_unidade_saude_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 6 (Unidade de saúde notificadora) da notificação Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra.
  - name: SG_UF_2
    field: "co_uf_residencia_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 17 (UF de residência) da notificação. Preenchimento automático no momento da digitação da ficha de notificação/investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra. Pode ser alterado pelo usuário.
  - name: ID_MUNIC_2
    field: "co_municipio_residencia_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 18 (Município de Residência) da notificação. Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para Outra. Pode ser alterado pelo Usuário.
  - name: NU_CEP2
    field: "nu_cep_residencia_atual"
    type: string
    description_pt: "CEP de residência atual do paciente"
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 27 (CEP de Residência) da notificação. Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra. Pode ser alterado pelo usuário.
  - name: D_DISTR_2
    field: "co_distrito_residencia_atual"
    type: string
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 19 (Distrito de Residência) da notificação. Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra. Pode ser alterado pelo usuário. Obedecer regras da tabela de Distrito.
  - name: ID_BAIRRO2
    field: "co_bairro_residencia_atual no_bairro_residencia_atual"
    type: string
  - name: NM_BAIRRO2
    field: "co_bairro_residencia_atual no_bairro_residencia_atual"
    type: string
  - name: BACILOSC_1
    field: "st_baciloscopia_1_mes"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo Alcóol- Resistentes) realizada em amostra colhida ao final do 1º mês de tratamento"
    characteristics: Campo Essencial Quando o campo 35 (Forma)= 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 1º mês) = 4 ( Não se aplica)
  - name: BACILOSC_2
    field: "st_baciloscopia_2_mes"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo Alcóol- Resistentes) realizada em amostra colhida ao final do 2º mês de tratamento"
    characteristics: Campo Essencial Quando o campo 35 (Forma)= 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 2º mês) = 4 (Não se aplica)
  - name: BACILOSC_3
    field: "st_baciloscopia_3_mes"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo Alcóol- Resistentes) realizada em amostra colhida ao final do 3º mês de Tratamento"
    characteristics: Campo Essencial Quando o campo 35 (Forma) = 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 3º mês) = 4 (Não se Aplica)
  - name: BACILOSC_4
    field: "st_baciloscopia_4_mes"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo Alcóol- Resistentes) realizada em amostra colhida ao final do 4º mês de tratamento"
    characteristics: Campo Essencial Quando o campo 35 (Forma) = 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 4º mês) = 4 (Não se aplica)
  - name: BACILOSC_5
    field: "st_baciloscopia_5_mes"
    type: string
    description_pt: "Resultado da baciloscopia de escarro para BAAR (Bacilo Alcóol- Resistentes) realizada em amostra colhida ao final do 5º mês de tratamento"
    characteristics: Campo Essencial Quando o campo 35 (Forma) = 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 5º mês) = 4 (Não se aplica)
  - name: BACILOSC_6
    field: "st_baciloscopia_6_mes"
    type: string
    description_pt: "Resultado das baciloscopias de escarro para BAAR (Bacilo Alcóol- Resistentes) realizadas em amostras colhidas no 6º mês de tratamento."
    characteristics: Campo Essencial Quando o campo 35 (Forma) = 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia no 6º mês) = 4 (Não se aplica)
  - name: BACILOSC_APOS_6
    field: "st_baciloscopia_apos_6_mes"
    type: string
    description_pt: "Resultado das baciloscopias de escarro para BAAR (Bacilo Alcóol- Resistentes) realizadas em amostras colhidas após o 6º mês de Tratamento."
    characteristics: Campo Essencial Quando o campo 35 (Forma) = 2 (Extrapulmonar) será preenchido automaticamente o campo 58 (Baciloscopia após 6º mês) = 4 Não se Aplica)
  - name: NU_PRONT_AT
    field: "nu_prontuario_atual"
    type: string
    description_pt: "Identificador do prontuário atual na unidade de saúde"
    characteristics: Campo alimentado automaticamente pelo sistema a partir do campo 31 (Nº do Prontuário) da notificação. Preenchimento automático no momento da digitação da ficha de notificação/ investigação. O campo será alterado quando há vinculação de 2 registros (Regra de vinculação) devido a transferência do caso de uma unidade para outra.
  - name: TRATSUP_AT
    field: "tp_tratamento_acompanhame nto"
    type: string
    description_pt: "Informar se foi realizado o Tratamento Diretamente Observado durante todo o tratamento do Caso Para ser considerado TDO realizado são necessárias 24 doses observadas na fase intensiva e 48 doses observadas na fase de manutenção."
    characteristics: Campo Essencial
  - name: NU_CONT_EX
    field: "nu_contato_examinado"
    type: string
    description_pt: "Preencher com o total de contatos examinados na investigação e acompanhamento do caso."
    characteristics: Campo Essencial Total de contatos examinados ≤ Total de contatos identificados (campo 47)
  - name: SITUA_ENCE
    field: "tp_situacao_encerramento"
    type: string
    description_pt: "Situação de encerramento do caso notificado"
    characteristics: Campo Obrigatório quando Campo 66 (Data de Encerramento) estiver preenchido. Quando preenchida com a opção= 5 (Transferência), habilitar o campo 63 (Se transferência). Quando o campo 62 (situação de encerramento) for preenchido com as opções 1, 2, 3, 4,6 ou 10 e o campo 40 (HIV) estiver preenchido com a opção= 3 (Em andamento), este deve ser alterado automaticamente para 4 (Não realizado) Quando o campo 62 (situação de encerramento) for preenchido com as opções 1,2,3,4,6 ou 10 e o campo 43 (Cultura) estiver preenchido com a opção= 3 (Em andamento), este deve ser alterado automaticamente para 4 (Não realizado) O campo 62 (Situação de Encerramento) deverá ser preenchido automaticamente com a opção 7 (TB DR) se campo 45 (Teste de Sensibilidade) for preenchido com as opções 1,2 ou 3
  - name: TRANSF
    field: "tp_transf"
    type: string
    description_pt: "Preencher com o código correspondente se a situação de encerramento for por “transferência”."
    characteristics: Campo obrigatório se o campo 62 (Situação de Encerramento)= 5 (transferência) Se campo 63 (Se transferência) = 2 preencher automaticamente o campo 64 (UF de transferência) = UF de notificação e habilita o campo 65 ( Município de transferência) Se campo 63 (Se transferência) = 2 ou 3 os campos 64 (UF de transferência) e 65 (Município de transferência) deverão ser habilitados.
  - name: SG_UF_TRANSF
    field: "co_uf_transf"
    type: string
    description_pt: "UF de Transferência, para os pacientes que forem transferidos para outro município e/ou outro estado"
    characteristics: Campo Obrigatório se campo 63 (Se transferência)= 3 O campo 64 (UF de transferência) deverá ser preenchido automaticamente com a UF de notificação, quando o campo 63 (Se transferência) = 2 Utilizar Regras de UF
  - name: MUN_TRANSF
    field: "co_municipio_transf"
    type: string
    description_pt: "Município de transferência para onde o paciente foi transferido"
    characteristics: Campo Obrigatório se campo 63 (Se transferência)= 2 ou 3 Utilizar Regras de Município
  - name: DT_ENCERRA
    field: "dt_encerramento Date"
    type: string
    characteristics: Campo Obrigatório Quando campo 62 (Situação de encerramento) for preenchido. Data encerramento posterior ou igual Data de notificação
  - name: OPORTU
    type: string
    description_pt: "Oportunidade de encerramento Dados preenchidos automaticamente a partir de cálculo do intervalo entre a data de encerramento e a data de notificação"
