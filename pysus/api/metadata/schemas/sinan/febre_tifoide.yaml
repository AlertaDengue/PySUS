    field: "tp_classificacao_final"
    type: string
    description_pt: "Confirma ou descarta o caso de Febre Tifóide."
    type_info: "varchar2(2)"
    required: true
    categories: 1. Confirmado 2. Descartado
    characteristics: Campo Obrigatório quando o campo data de encerramento estiver preenchido. Não permitir preenchimento com a opção 2-descartado se qualquer resultado do campo 46-Exames Laboratoriais for igual a 1- Samonella typhi.
  - name: CRITERIO
    field: "tp_criterio_confirmacao"
    type: string
    description_pt: "Define se o caso foi confirmado pelo critério de laboratório ou clínico- epidemiológico."
    type_info: "varchar2(2)"
    categories: 1. Laboratorial 2. Clínico epidemiológico
    characteristics: Campo Essencial Se todos os resultados do campo 46 estiverem em branco, Critério de Confirmação/Descarte deve ser diferente de 1.
  - name: TPAUTOCTO
    field: "tp_autoctone_residencia"
    type: string
    description_pt: "Indica se o caso é autóctone do município de residência ."
    type_info: "varchar2(1)"
    required: true
    categories: 1 – Sim 2 – Não 3 – Indeterminado
    characteristics: Campo Obrigatório se campo 48 classificação final=1(confirmado). Se o campo for preenchido com 1 (sim), o sistema preenche automaticamente os campos de autoctonia (UF, País e Município provável da fonte de infecção) com os valores registrados nos campos da notificação e habilita para o usuário preencher os campos distrito e bairro (se país de residência não for Brasil, a UF e município de infecção podem ficar em branco). Se o campo for preenchido com 2 (Não), o sistema habilita para o usuário preencher todos os campos de autoctonia (UF, País e Município, distrito e bairro provável da fonte de infecção). Se o campo for preenchido com 3 (Indeterminado), pular os campos de autoctonia (UF, País, Município, Distrito e Bairro provável da fonte de infecção). Campo habilitado se classificação final=1 ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados
  - name: COUFINF
    field: "co_uf_infeccao"
    type: string
