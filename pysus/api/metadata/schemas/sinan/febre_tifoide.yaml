# Column schemas for SINAN - FTIF
# Source: FTIF.csv from SINAN metadata tarball
# Total CSV rows: 121, exported fields: 92, skipped: 30

febre_tifoide:
  - name: DT_INVEST
    field: "dt_investigaçao"
    type: date
    description_pt: "Data em que ocorreu a investigação – informar a Data da 1ª visita ao paciente"
    required: true
    characteristics: Campo Obrigatório Data da investigação >= Data da notificação
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Informar a atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e Comércio)."
    type_info: "varchar2(6)"
    characteristics: Campo Essencial
  - name: CONTATO
    field: "tp_contato_caso_febre"
    type: string
    type_info: "varchar2(1)"
    categories: 1. Domicílio 2. Vizinhança 3. Trabalho 4. Creche/escola 5. Posto de saúde/hospital 6. Outro Estado/Município 7. Outros 8. Sem história de contato 9. Ignorado
    characteristics: Se categoria = 8 ou 9 pular para o campo 36 (Sugestão de vínculo).
  - name: CONT_OUT
    field: "ds_contato_caso_febre_outro"
    type: string
    description_pt: "Descrever qual foi o outro tipo de contato com caso semelhante até 45 dias antes do início dos sinais e sintomas."
    type_info: "varchar2(30)"
    characteristics: Campo Essencial Preencher se campo Contato compatível com caso de febre tifóide (até 45 dias antes do início dos sinais e sintomas =7(outros)
  - name: NM_CONTAT
    field: "no_contato"
    type: string
    description_pt: "Nome completo do contato"
    type_info: "varchar2(70)"
  - name: DDD
    field: "nu_ddd"
    type: string
    description_pt: "DDD do Telefone do contato"
    type_info: "varchar2(2)"
  - name: TEL_CONTAT
    field: "nu_telefone"
    type: string
    description_pt: "Telefone do contato"
    type_info: "varchar2(9)"
  - name: SUGE_VINCU
    field: "tp_sugestao"
    type: string
    description_pt: "Identificar fontes de infecção mais comuns."
    type_info: "varchar2(1)"
    required: true
    categories: 1. Consumo de água não tratada 2. Exposição à esgoto 3. Alimento suspeito 4. Deslocamento 5.Outros 9. Ignorado
    characteristics: Campo Obrigatório
  - name: VINC_OUT
    field: "ds_sugestao_outro"
    type: string
    description_pt: "Especificar outros tipos de vínculos."
    type_info: "varchar2(30)"
  - name: ASSINTOMAT
    field: "st_sinais_assintomatico"
    type: string
    description_pt: "O paciente assintomático"
    type_info: "varchar2(1)"
    required: true
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Obrigatório Se campo =1. Sim pular para campo 39.Tipo de Atendimento.
