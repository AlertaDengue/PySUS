# Column schemas for SINAN - FAMA
# Source: FAMA.csv from SINAN metadata tarball
# Total CSV rows: 65, exported fields: 50, skipped: 16

febre_amarela:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Informe a data do início da investigação."
    required: true
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Informar a atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e Comércio)."
    type_info: "varchar2(6)"
  - name: EPIZOOTIAS
    field: "st_ento_ocorrencia_epizootia"
    type: string
    description_pt: "Informar os dados da investigação entomológica (mosquitos) e epizootias Ocorrência de Epizootias (Mortandade de macaco conhecido como guariba , bugio, sagüis, micos, macaco aranha, macaco prego, guigó, soim, etc.)"
    type_info: "varchar2(1)"
  - name: ISOL_VIR_N
    field: "st_ento_isolamento_virus"
    type: string
    description_pt: "Informar os dados da investigação entomológica (mosquitos) e epizootias Isolamento de vírus em mosquitos"
    type_info: "varchar2(1)"
  - name: VETOR_A
    field: "st_ento_presenca_mosquito"
    type: string
    description_pt: "Informar os dados da investigação entomológica (mosquitos) e epizootias Presença de mosquito Aedes Aegypti presente em área urbana"
    type_info: "varchar2(1)"
  - name: VACINADO
    field: "st_vacinado_febre_amarela"
    type: string
    description_pt: "Se o paciente foi vacinado contra febre amarela"
    type_info: "varchar2(1)"
    required: true
  - name: DT_VACINA
    field: "dt_vacinado_febre_amarela"
    type: date
    description_pt: "Data da vacinação contra febre amarela."
  - name: UF_VAC
    field: "co_uf_antecedente"
    type: string
    description_pt: "UF em que foi realizada a vacinação"
    type_info: "varchar(2)"
  - name: MUNCI_VAC
    field: "co_municipio_antecedente"
    type: string
    description_pt: "Nome e código do município em que foi realizada a vacinação"
    type_info: "varchar2(6)"
  - name: UNID_VAC
    field: "co_unidade_antecedente"
    type: string
    description_pt: "Nome e código Unidade de Saúde onde paciente foi vacinado."
    type_info: "number(8,0)"
  - name: DOR_ABDO_N
    field: "st_sinais_dor_abdominal"
    type: string
    description_pt: "Informar os sinais e sintomas do paciente caso seja Dor Abdominal"
    type_info: "varchar2(1)"
  - name: SINT_HEM_N
    field: "st_sinais_hemorragico"
    type: string
    description_pt: "Informar os sinais e sintomas do paciente caso seja sinais hemorrágicos (Hematêmese, melena, epistaxe, gengivorragia, etc.)"
    type_info: "varchar2(1)"
  - name: FAGET
    field: "st_sinais_faget"
    type: string
    description_pt: "Informar os sinais e sintomas do paciente caso seja sinal de Faget (temperatura alta e freqüência cardíaca lenta)"
    type_info: "varchar2(1)"
  - name: EXCR_RENA_
    field: "st_sinais_excrecao_renal"
    type: string
    description_pt: "Informar os sinais e sintomas do paciente caso seja Distúrbios de excreção renal (oligúria e/ou anúria)"
    type_info: "varchar2(1)"
  - name: HOSPITALIZ
    field: "st_ocorreu_hospitalizacao"
    type: string
    description_pt: "Informar se ocorreu hospitalização do paciente"
    type_info: "varchar2(1)"
    required: true
  - name: DT_INTERNA
    field: "dt_internacao"
    type: date
    description_pt: "Data do início da internação do paciente"
  - name: UF
    field: "co_uf_hospital"
    type: string
    description_pt: "Sigla da UF onde o paciente foi internado"
    type_info: "varchar2(2)"
  - name: MUNICIPIO
    field: "co_municipio_hospital"
    type: string
    description_pt: "Nome completo do município onde o paciente foi internado"
    type_info: "varchar2(6)"
  - name: HOSPITAL
    field: "co_unidade_hospital"
    type: string
    description_pt: "Nome completo do Hospital onde o paciente foi internado"
    type_info: "number(8,0)"
  - name: BT
    field: "nu_exame_total"
    type: string
    description_pt: "Anotar maior valor encontrado independente da data do Resultado do exame Bilirrubina Total (mg/dl)"
    type_info: "varchar2(6)"
  - name: AST
    field: "nu_exame_ast"
    type: string
    description_pt: "Anotar maior valor encontrado independente da data do AST(TGO) UI"
    type_info: "number(5)"
  - name: BD
    field: "nu_exame_direta"
    type: string
    description_pt: "Anotar maior valor encontrado independente da data do Resultado do exame Bilirrubina Direta (mg/dl)"
    type_info: "varchar2(6)"
  - name: ALT
    field: "nu_exame_alt"
    type: string
    description_pt: "Anotar maior valor encontrado independente da data do ALT(TGP) UI"
    type_info: "number(5)"
  - name: DT_COL_1
    field: "dt_sorologico_coleta_1"
    type: date
    description_pt: "Data da coleta da 1ª amostra de sorologia"
  - name: S1_IGM
    field: "tp_sorologico_resultado_1"
    type: string
    type_info: "varchar2(1)"
  - name: DT_COL_2
    field: "dt_sorologico_coleta_2"
    type: date
    description_pt: "Data da coleta da 2ª amostra de sorologia"
  - name: S2_IGM
    field: "tp_sorologico_resultado_2"
    type: string
    type_info: "varchar2(1)"
  - name: MAT_COLETA
    field: "st_viral_coletado"
    type: string
    description_pt: "Informar se foi colhido material para realização de isolamento viral"
    type_info: "varchar2(1)"
  - name: DT_COLETA
    field: "dt_viral_coleta"
    type: date
    description_pt: "Data da coleta do material"
  - name: RES_ISOLAM
    field: "tp_resultado_isolamento"
    type: string
    type_info: "varchar2(1)"
  - name: HISTOPA
    field: "tp_histopatologia"
    type: string
    type_info: "varchar2(1)"
  - name: IMUNOH
    field: "tp_imunohitoquimica"
    type: string
    type_info: "varchar2(1)"
  - name: DT_PTPCR
    field: "Dt_pcr_coleta"
    type: date
    description_pt: "Data da coleta do PCR"
  - name: RES_PTPCR
    field: "tp_pcr_resultado"
    type: string
    type_info: "varchar2(1)"
  - name: CLASSI_FIN
    field: "tp_classificacao_final"
    type: string
    description_pt: "Conclusão da investigação"
    type_info: "varchar2(2)"
    required: true
  - name: CLASFIN_ES
    field: "ds_classificacao_final"
    type: string
    description_pt: "Especificação do diagnóstico do caso descartado (Especificar)"
    type_info: "varchar2(30)"
  - name: CRITERIO
    field: "tp_criterio_confirmacao"
    type: string
    description_pt: "Critério utilizado para confirmação ou descarte do caso"
    type_info: "varchar2(2)"
  - name: TPAUTOCTO
    field: "tp_autoctone_residencia"
    type: string
    description_pt: "Indica se o caso é autóctone do município de residência ."
    type_info: "varchar2(1)"
    required: true
  - name: COUFINF
    field: "co_uf_infeccao"
    type: string
    description_pt: "Sigla da unidade federada onde o paciente foi provavelmente infectado."
    type_info: "varchar2(2)"
    required: true
  - name: COPAISINF
    field: "co_pais_infeccao"
    type: string
    description_pt: "País onde o paciente foi provavelmente infectado."
    type_info: "varchar(4)"
    required: true
  - name: COMUNINF
    field: "co_municipio_infeccao"
    type: string
    description_pt: "Código do município onde o paciente foi provavelmente infectado. O nome está associado ao código na tabela de municípios."
    type_info: "varchar2(6)"
    required: true
  - name: CODISINF
    field: "co_distrito_infeccão"
    type: string
    description_pt: "Código do Distrito provável de Infecção do caso. O nome está associado ao código em tabela"
    type_info: "varchar2(4)"
  - name: CO_BAINFC
    field: "co_bairro_infeccao no_bairro_infeccao"
    type: string
    description_pt: "Código do bairro provável de Infecção do caso. Nome do bairro provável de infecção do caso."
    type_info: "number(8) vachar2(60)"
  - name: NOBAIINF
    field: "co_bairro_infeccao no_bairro_infeccao"
    type: string
    description_pt: "Código do bairro provável de Infecção do caso. Nome do bairro provável de infecção do caso."
    type_info: "number(8) vachar2(60)"
  - name: LOCALIDADE
    field: "no_localidade_infeccao"
    type: string
    description_pt: "Localidade de infecção"
  - name: DOENCA_TRA
    field: "st_doenca_trabalho"
    type: string
    description_pt: "Informar Se o paciente adquiriu a doença em decorrência das condições/situação de trabalho"
    type_info: "varchar2(1)"
  - name: CON_ATIVID
    field: "tp_atividade_infeccao"
    type: string
    type_info: "varchar2(1)"
  - name: EVOLUCAO
    field: "tp_evolucao_caso"
    type: string
    description_pt: "Evolução do caso"
    type_info: "varchar2(1)"
  - name: DT_OBITO
    field: "dt_obito"
    type: date
    description_pt: "Data do óbito"
  - name: DT_ENCERRA
    field: "dt_encerramento"
    type: date
    description_pt: "Data do encerramento da investigação"
    required: true
