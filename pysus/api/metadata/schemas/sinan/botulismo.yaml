    field: "st_alimento_industrial"
    type: string
    description_pt: "Informar se o alimento suspeito é comercializado e/ou produzido em indústria alimentícia"
    type_info: "varchar(1)"
    required: true
    categories: "1 – Sim 2 – Não 9 – Ignorado"
    characteristics: Campo obrigatório se campo 45 (Suspeita de Transmissão Alimentar) = 1. Habilitado se campo 45 (Suspeita de Transmissão Alimentar) = 1. Se diferente de 1, desabilitar o campo 48 (Se Industrial/Comercial, especificar marca, data de validade e lote) e pular para campo 49 Exposição ao alimento.
  - name: STCASEIRA
    field: "st_alimento_caseira"
    type: string
    description_pt: "Informar se o alimento é produzido de forma artesanal"
    type_info: "varchar(1)"
    required: true
    categories: "1 – Sim 2 – Não 9 – Ignorado"
    characteristics: Campo obrigatório se campo 45 (Suspeita de Transmissão Alimentar) = 1. Habilitado se campo 45 (Suspeita de Transmissão Alimentar) = 1. Deve ser diferente de 1 se campo 47 (Produção do suspeito Industrial/Comercial) = 1.
  - name: DS_INDUS
    field: "ds_alimento_industrial"
