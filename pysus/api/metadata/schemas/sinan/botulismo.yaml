# Column schemas for SINAN - BOTU
# Source: BOTU.csv from SINAN metadata tarball
# Total CSV rows: 121, exported fields: 120, skipped: 1

botulismo:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Data em que ocorreu a investigação – informar a Data da 1ª visita ao paciente"
    required: true
    characteristics: Campo obrigatório Data da investigação > ou = Data da notificação
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Informar a atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e comércio)"
    type_info: "varchar(6)"
  - name: DTATEND
    field: "dt_atendimento"
    type: date
    description_pt: "Data do 1º atendimento médico do paciente em posto de saúde, unidade de saúde ou hospital."
    characteristics: Campo essencial Data do 1º atendimento > = Data de primeiros sintomas.
  - name: NUATEND
    field: "nu_atendimento"
    type: string
    description_pt: "Informar o Nº total de atendimentos até a suspeita clínica de botulismo. Caso não haja atendimento médico, informar 0 (zero) atendimentos"
    type_info: "number(4,0)"
    characteristics: Campo essencial
  - name: DTSUSPEIC
    field: "dt_suspeicao"
    type: date
    description_pt: "Informar a data da suspeita clínica"
    characteristics: Campo essencial Data da suspeição clínica > = Data de primeiros sintomas
  - name: STHOSPITAL
    field: "st_ocorreu_hospitalizacao"
    type: string
    description_pt: "Informar se o paciente foi internado"
    type_info: "varchar(1)"
    required: true
    categories: "1 – Sim 2 – Não 9 – Ignorado"
    characteristics: Campo obrigatório Se categoria = 2- Não ou 9 - ignorado, pular para o campo 42 (Sinais e Sintomas Febre) desabilitando os campos 37 (Data da Internação), 38 (Data da Alta Hospitalar), 39 (UF do Hospital), 40 (Município do Hospital) e 41 (Nome do Hospital).
  - name: DTINTERNA
    field: "dt_internacao"
    type: date
    characteristics: Campo essencial Habilitado se campo 36 (Ocorreu hospitalização) = 1(sim). Data da Internação > = Data de primeiros sintomas
  - name: DTALTA
    field: "dt_alta"
    type: date
    description_pt: "Data em que o paciente teve alta hospitalar e retornou ao domicílio"
    characteristics: Campo essencial Habilitado se campo 36 (Ocorreu hospitalização) =1(sim). Data da alta hospitalar >= Data de Internação
  - name: UF_HOSP
    field: "co_uf_hospital"
    type: string
    description_pt: "Informe a sigla da UF onde o paciente foi internado"
    type_info: "varchar(2)"
    characteristics: Campo essencial Habilitado se campo 36 (Ocorreu hospitalização) =1(sim).
  - name: MUN_HOSP
    field: "co_municipio_hospital"
    type: string
    description_pt: "Informe Nome do município onde o paciente foi internado"
    type_info: "varchar(6)"
    characteristics: Campo essencial Habilitado se campo 36 (Ocorreu hospitalização) =1(sim).
  - name: UNID_HOSP
    field: "co_unidade_hospital"
    type: string
    description_pt: "Informe o nome do Hospital"
    type_info: "number(7)"
  - name: STFEBRE
