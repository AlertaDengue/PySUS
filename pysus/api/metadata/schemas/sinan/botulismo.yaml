    type_info: "varchar(1)"
    categories: "1 – Sim 2 – Não 9 – Ignorado"
    characteristics: Campo essencial Se campo = (1) Única, pular para campo 50 (Se única, tempo decorrido entre ingestão e início dos sintomas). Se campo = (2) Múltipla, pular para campo 51 (Se múltipla tempo decorrido entre a primeira ingestão e início dos sintomas). Se = 9 (Ignorado) ou null, pular para campo 53 (Local da ingestão).
  - name: DS_INGEST
