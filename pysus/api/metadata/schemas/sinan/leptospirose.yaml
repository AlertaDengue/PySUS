    type_info: "varchar(4)"
    required: true
    categories: Tabela com código e descrição de paises.
    characteristics: Campo obrigatório e se campo classificação final=1(confirmado) Se o campo (O caso é autóctone do município de residência) for = 1 (sim), preencher automaticamente com o País de residência do caso. Campo habilitado se classificação final= 1 ou Null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente Apagados.
  - name: COMUNINF
