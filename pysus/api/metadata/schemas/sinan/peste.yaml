  - name: SIN_GANG
    field: "st_sintomatologia_ganglionar"
    type: string
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: SIN_PULM
    field: "st_sintomatologia_pulmonar"
    type: string
    type_info: "varchar2(1)"
    required: true
  - name: TB_INVESTIG
    field: "st_sintomatologia_pulmonar"
    type: string
    type_info: "varchar2(1)"
    required: true
  - name: A_PESTE
    field: "st_sintomatologia_pulmonar"
    type: string
    type_info: "varchar2(1)"
    required: true
  - name: LAB_HEMO
