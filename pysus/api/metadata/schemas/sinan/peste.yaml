# Column schemas for SINAN - PEST
# Source: PEST.csv from SINAN metadata tarball
# Total CSV rows: 32, exported fields: 35, skipped: 0

peste:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Data em que ocorreu a investigação – informar a data da 1ª visita ao paciente"
    required: true
    characteristics: Campo Obrigatório Data da investigação > ou = Data da notificação. Data da investigação deve ser menor ou igual a data atual.
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Informar a atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e Comércio)."
    type_info: "varchar2(1)"
    characteristics: Portaria nº 3.947/GM em 25 de novembro de 1998
  - name: CO_RISCO
    field: "st_condicao_risco"
    type: string
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: EPI_PESTE
    field: "st_importancia_peste"
    type: string
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
