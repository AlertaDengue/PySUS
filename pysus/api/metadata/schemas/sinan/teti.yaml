# Column schemas for SINAN - TETA
# Source: TETA.csv from SINAN metadata tarball
# Total CSV rows: 37, exported fields: 37, skipped: 1

teti:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Data completa do inicio da investigação iniciada (Data da primeira ação desenvolvida após o conhecimento do caso)"
    required: true
    categories: DD/MM/AAA
    characteristics: Campo Obrigatório Data da investigação maior ou igual à Data da notificação Data da investigação deve ser menor ou igual a data atual
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e Comércio)."
    type_info: "varchar2(6)"
    characteristics: Campo Essencial
  - name: TP_CAUSA
    field: "tp_possivel_causa"
    type: string
    description_pt: "Informa a possível porta de entrada da doença segundo informação do paciente. Deve-se investigar se houve história de injeção nos últimos 21 dias ou demais opções nos últimos 30 dias."
    type_info: "varcha r2(1)"
    categories: 1-Injeção 2-Laceração 3-Queimadura 4-Cirúrgico 5-Perfuração 6-Escoriação 7-Abortamento Séptico 8-Outros 9-Ignorado
    characteristics: Campo Essencial
  - name: TP_CAUSOUT
    field: "ds_possivel_causa_outro"
    type: string
    description_pt: "Descrição de outra possível causa"
    type_info: "varchar2(30)"
    characteristics: Habilitado se campo 33- Possível Causa for =a 8
  - name: TP_LOCALLE
    field: "tp_local_lesao"
    type: string
    description_pt: "Local da lesão que provavelmente foi a porta de entrada para o agente etiológico"
    type_info: "varchar2(1)"
    categories: 1- Membros Inferiores 2- Membros Superiores 3- Tronco 4- Cabeça/ Pescoço 5- Cavidade Oral 9- Ignorado
    characteristics: Campo Essencial
  - name: NU_DOSE
    field: "tp_dose_aplicada"
    type: string
    description_pt: "Número de doses recebidas de uma ou mais das seguintes vacinas: DTP, DT, dT, TT ou Tetravalente antes da lesão"
    type_info: "varchar2(1)"
    categories: 1. Uma 2. Duas 3. Três 4. Três mais 1 reforço 5. Três mais 2 reforços 6. Nunca vacinado 9. Ignorado
    characteristics: Campo Essencial se igual a 6 ou 9 ou null, pular para campo 37 (Tratamento específico e outras medidas).
  - name: DT_ULT_DOS
    field: "dt_ultima_dose"
    type: date
    description_pt: "Data da última dose da vacina contra tétano (DPT,DT,dT,TT Tetra)"
    characteristics: Campo Essencial se campo 35 (Número de doses aplicadas) for igual a 1, 2, 3, 4 ou 5. Campo habilitado se campo 35 (Número de doses aplicadas) for igual a 1, 2, 3, 4 ou 5.
  - name: TP_PROFILA
    field: "tp_tratamento_especifico"
    type: string
    description_pt: "Informar a substância que foi utilizada utilizada na profilaxia, após ferimento."
    type_info: "varchar2(1)"
    categories: 1- Soro Antitetânico 2- Imunoglobulina 3- Vacina 4- Antibiótico 5- Nenhum
    characteristics: Campo Essencial
  - name: CS_TRISMO
    field: "st_manifestacao_trismo"
    type: string
    description_pt: "Se o paciente apresentou dificuldade ou sensibilidade em abrir a boca"
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: CS_RISO
    field: "st_manifestacao_riso"
    type: string
    description_pt: "Se o paciente apresentou riso sarcástico"
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: CS_OPISTOT
    field: "st_manifestacao_opistotono"
    type: string
    description_pt: "Se o paciente apresentou rigidez musculatura dorsal"
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: CS_NUCA
    field: "st_manifestacao_nuca"
    type: string
    description_pt: "Se o paciente apresentou rigidez musculatura da nuca"
    type_info: "varchar2(1)"
    categories: 1-Sim 2-Não 9-Ignorado
  - name: CS_ABDOMIN
    field: "st_manifestacao_abdominal"
    type: string
    description_pt: "Se o paciente apresentou rigidez musculatura abdominal"
    type_info: "varchar2(1)"
    categories: 1-Sim 2-Não 9-Ignorado
  - name: CS_MEMBROS
    field: "st_manifestacao_membro"
    type: string
    description_pt: "Se o paciente apresentou rigidez nas pernas e/ou braços"
    type_info: "varchar2(1)"
    categories: 1-Sim 2-Não 9-Ignorado
  - name: CS_CRISES
    field: "st_manifestacao_crise"
    type: string
    description_pt: "Se o paciente apresentou crises de contraturas musculares"
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório
  - name: CS_SIN_OUT
    field: "st_manifestacao_outro"
    type: string
    description_pt: "Se o paciente apresentou manifestações clinicas além das citadas"
    type_info: "varchar2(1)"
    categories: 1-Sim 2-Não 9-Ignorado
  - name: NM_SIN_OUT
    field: "ds_manifestacao_outro"
    type: string
    description_pt: "Manifestações clínicas outras manifestações (Especificar)"
    type_info: "varchar2(30)"
    characteristics: Habilitado somente se manifestações clinicas (outros)=1.
  - name: TP_ORIGEM
    field: "tp_origem_caso"
    type: string
    description_pt: "Identificar se o conhecimento do caso se deu por notificação possível ou por ocasião da busca ativa, ou pela declaração de óbito"
    type_info: "varchar2(1)"
    categories: 1-Notificação 2-Busca ativa 3-Declaração de óbito
  - name: CS_HOSPITA
    field: "st_ocorreu_hostpitalizacao"
    type: string
    description_pt: "Informar se o paciente foi hospitalizado para tratamento após a manifestação clínica da doença."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo Obrigatório se campo= 2(não) ou 9(ignorado) pular para o campo 44 (Medidas de controle).
  - name: DT_INTERNA
    field: "dt_internacao"
    type: date
    description_pt: "Data de internação, caso tenha ocorrido"
    required: true
    categories: DD/MM/AAAA
    characteristics: Campo Obrigatório se campo 40 (Ocorreu hospitalização) = 1(sim). Data da internação maior ou igual à Data de primeiros Sintomas.
  - name: SG_UF_INTE
    field: "co_uf_hospital"
    type: string
    description_pt: "Sigla da UF onde o paciente foi internado"
    type_info: "varchar2(2)"
  - name: NM_MUNIC_H
    field: "co_municipio_hospital"
    type: string
    description_pt: "Nome do município onde o paciente foi internado"
    type_info: "varchar2(6)"
  - name: TP_IDENTFI
    field: "st_medida_identificar"
    type: string
    description_pt: "Se foi identificada pessoas com esquema vacinal incompleto ou não vacinadas."
    type_info: "varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: TP_VACINA
    field: "st_medida_vacinacao"
    type: string
    description_pt: "Se foi analisada a cobertura vacinal da população do município em que reside o caso"
    type_info: "varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: TP_ANALISE
    field: "st_medida_analise"
    type: string
    description_pt: "Se foi realizada vacinação nas pessoas vulneráveis"
    type_info: "varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo Essencial
  - name: CLASSI_FIN
    field: "tp_classificacao_final"
    type: string
    description_pt: "Confirmação do caso ou descarte do suspeito que não atende aos critérios de confirmação após a investigação"
    type_info: "varchar2(1)"
    required: true
    categories: 1. Confirmado 2. Descartado
    characteristics: Campo Obrigatório quando o campo data de encerramento estiver preenchido
  - name: CS_LOCAL
    field: "tp_local_infeccao"
    type: string
    description_pt: "Local onde provavelmente ocorreu a infecção"
    type_info: "varchar2(1)"
    categories: 1- Domicílio 2- Trabalho 3- Via pública 4- Escola 5- Campo 6- Unidade de saúde 7- Outro local 9- Ignorado
    characteristics: Campo Essencial se o campo Classificação final = 1. Campo habilitado se classificação final= 1 ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: TPAUTOCTO
    field: "tp_autoctone_residencia"
    type: string
    description_pt: "Indica se o caso é autóctone do município de residência ."
    type_info: "varchar2(1)"
    required: true
    categories: 1 – Sim 2 – Não 3 – Indeterminado
    characteristics: Campo Obrigatório se campo classificação final = 1 (confirmado) Se o campo for preenchido com 1 (sim), o sistema preenche automaticamente os campos de autoctonia (UF, País e Município provável da fonte de infecção) com os valores registrados nos campos da notificação e habilita para o usuário preencher os campos distrito e bairro (se país de residência não for Brasil, a UF e município de infecção podem ficar em branco) Se o campo for preenchido com 2 (Não), o sistema habilita para o usuário preencher todos os campos de autoctonia (UF, País e Município, distrito e bairro provável da fonte de infecção) Se o campo for preenchido com 3 (Indeterminado), pular os campos de autoctonia (UF, País, Município, Distrito e Bairro provável da fonte de infecção) Campo habilitado se classificação final= 1ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: COUFINF
    field: "co_uf_infeccao"
    type: string
    description_pt: "Sigla da unidade federada onde o paciente foi provavelmente infectado."
    type_info: "varchar2(2)"
    required: true
    categories: Tabela com siglas e código padronizados pelo IBGE
    characteristics: Campo Obrigatório se país de infecção= Brasil e campo classificação final =1(confirmado) Se o campo (O caso é autóctone do município de residência) for = 1 (sim), o sistema preenche automaticamente com a UF de residência do caso, se o país de residência for Brasil. Campo habilitado se classificação final= 1ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: COPAISINF
    field: "co_pais_infeccao"
    type: string
    description_pt: "País onde o paciente foi provavelmente infectado."
    type_info: "varchar(4)"
    required: true
    categories: Tabela com código e descrição de paises.
    characteristics: Campo Obrigatório se campo classificação final=1(confirmado) Se o campo (O caso é autóctone do município de residência) for = 1 (sim), preencher automaticamente com o País de residência do caso. Campo habilitado se classificação final= 1ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: COMUNINF
    field: "co_municipio_infeccao"
    type: string
    description_pt: "Código do município onde o paciente foi provavelmente infectado. O nome está associado ao código na tabela de municípios."
    type_info: "varchar2(6)"
    required: true
    categories: Tabela com Códigos e nomes padronizados pelo IBGE
    characteristics: Campo Obrigatório se país de infecção = Brasil e campo classificação final=1(confirmado) Se o campo (O caso é autóctone do município de residência do caso) for = 1 (sim), o sistema preenche automaticamente com o Município de residência do caso Campo habilitado se classificação final= 1ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: CODISINF
    field: "co_distrito_infeccão"
    type: string
    description_pt: "Código do Distrito provável de Infecção do caso. O nome está associado ao código em tabela"
    type_info: "varchar2(4)"
    categories: Tabela com Códigos e nomes padronizados segundo Tabela disponibilizada pelo sistema para cadastramento pelo gestor municipal do Sinan
    characteristics: Campo Essencial quando país de infecção = Brasil e o município de infecção for subdividido em distrito e se campo classificação final for igual a 1 (confirmado) Campo habilitado se classificação final= 1ou null. Quando a classificação final for preenchida com 2(descartado) os dados desse campo são automaticamente apagados.
  - name: CO_BAINFC
    field: "co_bairro_infeccao no_bairro_infeccao"
    type: string
    description_pt: "Código do bairro provável de Infecção do caso. Nome do bairro provável de infecção do caso."
    type_info: "number(8) vachar2(60)"
  - name: NOBAIINF
    field: "co_bairro_infeccao no_bairro_infeccao"
    type: string
    description_pt: "Código do bairro provável de Infecção do caso. Nome do bairro provável de infecção do caso."
    type_info: "number(8) vachar2(60)"
  - name: EVOLUCAO
    field: "tp_evolucao_caso"
    type: string
    description_pt: "Informar como o paciente evoluiu"
    type_info: "varchar2(1)"
    categories: 1. Cura 2. Óbito por tétano acidental 3. Óbito por outras causas 9. Ignorado
    characteristics: Campo Essencial Campo habilitado se classificação final= 1,2ou null. Se classificação final=2(descartado) não permitir a opção o preenchimento com a opção 2(óbito por tétano acidental).
  - name: DT_OBITO
    field: "tp_evolucao_caso"
    type: date
    description_pt: "Data de óbito"
    categories: Dd/mm/aaaa
    characteristics: Campo Essencial se campo Evolução do caso= 2(óbito por tétano) ou 3(óbito por outras causas) Campo > ou = data dos primeiros sintomas. Campo habilitado se 53(Evolução do caso)= 2(Óbito por tétano acidental ou 3(Óbito por outras causas)
  - name: DT_ENCERRA
    field: "dt_encerramento"
    type: date
    description_pt: "Data do encerramento da investigação"
    required: true
    characteristics: Campo Obrigatório quando campo Classificação final estiver preenchido. Data de Encerramento deve ser maior ou igual Data de Investigação. Data de Encerramento deve ser menor ou igual a data atual
