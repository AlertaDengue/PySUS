# Column schemas for SINAN - LEIV
# Source: LEIV.csv from SINAN metadata tarball
# Total CSV rows: 54, exported fields: 55, skipped: 0

leishmaniose_visceral:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Data em que ocorreu a investigação – informar a data da 1ª visita ao paciente"
    required: true
    characteristics: Campo obrigatório Data da investigação > ou = data da notificação
  - name: ID_OCUPA_N
