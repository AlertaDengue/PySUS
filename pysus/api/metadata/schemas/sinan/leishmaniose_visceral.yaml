    field: "st_doenca_trabalho"
    type: string
    description_pt: "Informar a evolução do caso"
    type_info: "varchar2(1)"
    categories: 1. Sim 2. Não 9. Ignorado
    characteristics: Campo habilitado se classificação final=1 ou null. Se campo 44 (Classificação final) = 2(descartado) os dados desse campo são automaticamente apagados.
  - name: EVOLUCAO
    field: "tp_evolucao_caso"
    type: string
    description_pt: "Informar a data do óbito"
    type_info: "varchar2(1)"
    categories: 1. Cura 2. Abandono 3. Óbito por LV 4. Óbito por outras causas 5. Transferênci a
    characteristics: Campo essencial Se campo = 3 ou 4, pular para o campo 54 (Data do Óbito). Se campo ≠ 3 ou 4, pular para o campo 55 (Data do encerramento). Campo habilitado se classificação final=1,2 ou null. Se classificação final=2(descartado) não permitir o preenchimento com a opção 3 (óbito por LV).
  - name: DT_OBITO
    field: "dt_obito"
    type: date
    description_pt: "Informar a data do encerramento do caso"
    required: true
    characteristics: Campo Obrigatório se campo Evolução do Caso = 3 ou 4 (óbito) Data do Óbito deve ser maior ou igual à Data dos Primeiros Sintomas Campo habilitado se campo Evolução= 3- Óbito por LV ou 4-Óbito por outras causas.
  - name: DT_ENCERRA
