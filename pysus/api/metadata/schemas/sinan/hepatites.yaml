# Column schemas for SINAN - HEPA
# Source: HEPA.csv from SINAN metadata tarball
# Total CSV rows: 103, exported fields: 63, skipped: 40

hepatites:
  - name: DT_INVEST
    field: "dt_investigacao"
    type: date
    description_pt: "Data em que ocorreu o início da investigação do caso – informar a Data da 1ª visita ao paciente"
    required: true
    characteristics: Campo obrigatório Data da investigação >= Data da notificação
  - name: ID_OCUPA_N
    field: "co_cbo_ocupacao"
    type: string
    description_pt: "Informar a atividade exercida pelo paciente no setor formal, informal ou autônomo ou sua última atividade exercida quando paciente for desempregado ou aposentado. O ramo de atividade econômica do paciente refere-se as atividades econômicas desenvolvidas nos processos de produção do setor primário (agricultura e extrativismo); secundário (indústria) ou terciário (serviços e comércio)."
    type_info: "varchar2(6)"
  - name: HEPATITE_N
    field: "tp_suspeita"
    type: string
    description_pt: "Informar o tipo de hepatite viral da qual o paciente é suspeito."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Hepatite A 2-Hepatite B/C 3-Não especificada
    characteristics: Campo obrigatório
  - name: HEPATITA
    field: "tp_vacina_hepatite_a"
    type: string
    description_pt: "Informar se o paciente tem vacinação contra hepatite A com esquema completo, incompleto ou não vacinado comprovado no cartão de vacinação."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Completa 2-Incompleta 3-Não vacinado 9-Ignorado
    characteristics: Campo obrigatório
  - name: HEPATITB
    field: "tp_vacina_hepatite_b"
    type: string
    description_pt: "Informar se o paciente tem vacinação contra hepatite B com esquema completo, incompleto ou não vacinado comprovado no cartão de vacinação."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Completa 2-Incompleta 3-Não vacinado 9-Ignorado
    characteristics: Campo obrigatório Habilitado se item anterior estiver preenchido.
  - name: INSTITUCIO
    field: "tp_institucionalizado"
    type: string
    description_pt: "Informar se paciente é institucionalizado e em que tipo de instituição. Havendo mais de uma considerar a de maior tempo de permanência."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Creche 2-Escola 3-Asilo 4-Empresa 5-Penitenciária 6-Hospital/ Clínica 7-Outras 8-Não institucionalizado 9-Ignorado
    characteristics: Campo obrigatório
  - name: HIV
    field: "st_agravo_associado_aids"
    type: string
    description_pt: "Informar sobre a infecção pelo HIV/Aids diagnosticados no paciente em qualquer momento da vida."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo obrigatório
  - name: OUTRA_DST
    field: "st_agravo_associado_dst_outro"
    type: string
    description_pt: "Informar sobre DSTs diagnosticadas no paciente em qualquer momento da vida."
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim 2-Não 9-Ignorado
    characteristics: Campo obrigatório
  - name: SEXUAL
    field: "tp_contato_paciente_vhb_sexual"
    type: string
    description_pt: "Informar se paciente teve contato sexual com paciente com diagnóstico laboratorial específico de hepatite B ou C e há quanto tempo (considerar a data da investigação como parâmetro)"
    type_info: "varchar2(1)"
    required: true
    categories: 1-Sim há menos de 6 meses 2-Sim há mais de seis meses 3-Não 9-Ignorado
    characteristics: Campo obrigatório
